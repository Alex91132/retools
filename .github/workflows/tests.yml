name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # NumPy 2.3+ требует Python >= 3.11, поэтому на 3.10 — последняя 2.2.x
          - {python-version: "3.10", numpy: "2.2.6"}
          - {python-version: "3.11", numpy: "2.4.6"}
          - {python-version: "3.12", numpy: "2.4.6"}
          # отдельная проверка на NumPy 1.x: в 2.0 убрали np.trapz
          - {python-version: "3.11", numpy: "1.26.4"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "numpy==${{ matrix.numpy }}"
          python -c "import numpy; print('NumPy', numpy.__version__)"
      - name: Тесты
        run: pytest -q
      - name: CLI запускается
        run: python -m retools --help

  wheel:
    # Регрессия на упаковку: раньше фикстуры читались из tests/ и после
    # `pip install` падало FileNotFoundError.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Собрать wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Установить из wheel и проверить данные пакета
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python - <<'PY'
          from retools.pallets import default_pallets
          from retools.jd_pallets import default_pallet
          from retools.resources import data_path

          grids = default_pallets()
          assert set(grids) == {"mu", "kro_mix", "krw_mix"}, grids.keys()
          assert data_path("pallets_fixture.json").exists()
          assert default_pallet() is not None
          print("данные пакета доступны из wheel:", sorted(grids))
          PY