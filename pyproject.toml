[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retools"
version = "0.1.0"
description = "Порт расчётника RE Tools (VBA/Excel) на Python: подбор компоновки ГС/МЗС по РИГИС, расчёт добычи по рейтингу ГТМ"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.40", "plotly", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

# Данные пакета: контрольные выгрузки и демо-проект для Streamlit.
# Раньше лежали в tests/ и после pip install были недоступны.
[tool.setuptools.package-data]
retools = ["data/*.json"]

[tool.pytest.ini_options]
# Тесты должны проверять код этого репозитория, а не установленный пакет
pythonpath = ["src"]
testpaths = ["tests"]